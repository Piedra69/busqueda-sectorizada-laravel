<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demo - Búsqueda sectorizada</title>
<style>
:root{font-family:Arial,sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.topbar{background:#1c2a52;color:#fff;padding:22px 0}.container{width:min(1100px,92%);margin:auto}.brand{font-size:22px;font-weight:700}.subtitle{margin-top:5px;opacity:.82}.panel{background:#fff;margin-top:28px;padding:22px;border:1px solid #e2e7f0;border-radius:12px}.filters{display:grid;grid-template-columns:1fr 1fr 1.5fr auto;gap:12px;align-items:end}label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}select,input{width:100%;padding:11px 12px;border:1px solid #cfd6e4;border-radius:7px;font-size:14px}button{border:0;border-radius:7px;padding:11px 16px;cursor:pointer;font-weight:700;background:#d93420;color:#fff}.clear{border:0;border-radius:7px;padding:11px 16px;cursor:pointer;font-weight:700;color:#26365c;background:#edf1f7}.summary{display:flex;justify-content:space-between;align-items:center;margin:26px 0 12px}.count{font-weight:700}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding-bottom:40px}.card{background:#fff;border:1px solid #e2e7f0;border-radius:10px;padding:18px}.tags{display:flex;gap:8px;margin-bottom:10px}.tag{font-size:12px;font-weight:700;background:#eef2f9;color:#30436f;padding:5px 8px;border-radius:20px}.tag.type{background:#fff0ed;color:#a93426}h2{font-size:18px;margin:5px 0 8px}p{color:#526079;line-height:1.45;margin:0 0 12px}.date{font-size:12px;color:#7b879c}.empty{background:#fff;border:1px dashed #cbd3e3;padding:30px;text-align:center;border-radius:10px}@media(max-width:800px){.filters,.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topbar"><div class="container"><div class="brand">Sistema de Búsqueda Sectorizada</div><div class="subtitle">Personas · Adultos mayores · Mascotas · Objetos</div></div></header>
<main class="container">
<section class="panel"><div class="filters">
<div><label>Sector</label><select id="sector"><option value="">Todos los sectores</option><option>Centro</option><option>Norte</option><option>Universitario</option></select></div>
<div><label>Tipo de reporte</label><select id="tipo"><option value="">Todos los tipos</option><option value="persona">Persona</option><option value="adulto_mayor">Adulto mayor</option><option value="mascota">Mascota</option><option value="objeto">Objeto</option></select></div>
<div><label>Palabra clave</label><input id="q" placeholder="Ej.: perro, mochila, chaqueta..."></div>
<div><button id="buscar">Buscar</button> <button id="limpiar" class="clear">Limpiar</button></div>
</div></section>
<div class="summary"><div id="count" class="count"></div><div>Solo se muestran reportes activos</div></div>
<section id="resultados" class="grid"></section>
<div id="empty" class="empty" hidden><strong>No se encontraron resultados.</strong><br>Intente cambiar el sector, el tipo o la palabra clave.</div>
</main>
<script>
const data=[
{titulo:'Perro golden extraviado',tipo:'mascota',sector:'Norte',descripcion:'Golden retriever con collar azul visto cerca de la avenida principal.',fecha:'08/10/2026'},
{titulo:'Adulto mayor no localizado',tipo:'adulto_mayor',sector:'Centro',descripcion:'Varón de 76 años, chaqueta café y gorra negra.',fecha:'08/10/2026'},
{titulo:'Mochila negra encontrada',tipo:'objeto',sector:'Universitario',descripcion:'Mochila encontrada cerca de una parada de transporte.',fecha:'07/10/2026'},
{titulo:'Gato blanco perdido',tipo:'mascota',sector:'Norte',descripcion:'Gato blanco con manchas grises; responde al nombre de Copito.',fecha:'07/10/2026'},
{titulo:'Celular encontrado',tipo:'objeto',sector:'Centro',descripcion:'Teléfono negro encontrado en una banca de plaza.',fecha:'06/10/2026'}];
const s=document.querySelector('#sector'),t=document.querySelector('#tipo'),q=document.querySelector('#q'),r=document.querySelector('#resultados'),c=document.querySelector('#count'),e=document.querySelector('#empty');
function labelTipo(v){return {persona:'Persona',adulto_mayor:'Adulto mayor',mascota:'Mascota',objeto:'Objeto'}[v]||v}
function render(){const text=q.value.trim().toLowerCase();const filtered=data.filter(x=>(!s.value||x.sector===s.value)&&(!t.value||x.tipo===t.value)&&(!text||(x.titulo+' '+x.descripcion).toLowerCase().includes(text)));c.textContent=`${filtered.length} reporte(s) encontrado(s)`;r.innerHTML=filtered.map(x=>`<article class="card"><div class="tags"><span class="tag">${x.sector}</span><span class="tag type">${labelTipo(x.tipo)}</span></div><h2>${x.titulo}</h2><p>${x.descripcion}</p><div class="date">Reportado: ${x.fecha}</div></article>`).join('');e.hidden=filtered.length!==0;r.hidden=filtered.length===0}
document.querySelector('#buscar').onclick=render;document.querySelector('#limpiar').onclick=()=>{s.value='';t.value='';q.value='';render()};s.value='Norte';t.value='mascota';render();
</script>
</body></html>
